# Sandbox example: prefer bootstrap.py, which writes an absolute stdio adapter path.
# Never copy agent credentials between profiles. Production has a separate profile.
mcp_servers:
  creatorpulse:
    command: /absolute/path/to/hermes/python
    args: ["/absolute/path/to/profiles/creatorpulse-sandbox/integrations/creatorpulse-local/proxy.py", "--environment", "sandbox", "--env-file", "/absolute/path/to/profiles/creatorpulse-sandbox/.env"]
    enabled: true
    timeout: 60
    tools:
      resources: false
      prompts: false
