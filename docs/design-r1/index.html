function setCompose(k,v){if(k==='account'){composeAccount=v;composeUrl='';}if(k==='mode')composeMode=v;if(k==='source')composeSource=v;reviewStep=false;render()}function compose(){return head('New post','Choose one account and review before submission',btn('Back',"go('publishing')",'back'))+`<div class="compose-layout"><section class="panel">${panelhead('Post details','Manual publication')}<div class="form-section"><label class="form-label" for="target">Target account</label><select id="target" class="full-input" onchange="setCompose('account',this.value)"><option value="">Select TikTok account</option>${accounts.map(a=>`<option value="${a.id}" ${composeAccount===a.id?'selected':''}>${a.name}</option>`).join('')}</select><p>Explicit account selection is required for every new post.</p></div>${composeAccount?`<div class="form-section"><label class="form-label">Publishing mode</label><div class="seg"><button class="${composeMode==='inbox'?'active':''}" onclick="setCompose('mode','inbox')">Inbox</button><button class="${composeMode==='direct'?'active':''}" onclick="setCompose('mode','direct')">Direct Post</button></div><p>${composeMode==='inbox'?'Upload to TikTok inbox; finish publication in TikTok.':'Requires verified capabilities, preview, duration and explicit visibility.'}</p></div><div class="form-section"><label class="form-label">Video source</label><div class="seg"><button class="${composeSource==='url'?'active':''}" onclick="setCompose('source','url')">URL</button><button class="${composeSource==='file'?'active':''}" onclick="setCompose('source','file')">File</button></div><div style="margin-top:10px">${composeSource==='url'?`<input aria-label="Video URL" class="full-input" placeholder="https://…/video.mp4" type="url" value="${esc(composeUrl)}" oninput="updateComposeUrl(this.value)">`:'<input aria-label="Video file" class="full-input" type="file" accept="video/mp4,video/quicktime" onchange="updateComposeFile(this)">'}</div><p>${composeSource==='url'?'Use an immutable HTTPS URL on a TikTok-verified domain.':'MP4 / MOV · maximum 4 MB.'}</p></div>${composeMode==='direct'?`<div class="form-section"><label class="form-label" for="caption">Caption</label><textarea class="full-input textarea" id="caption" placeholder="Write caption…"></textarea><label class="form-label" style="margin-top:12px" for="privacy">Visibility</label><select class="full-input" id="privacy"><option>Choose privacy</option><option>Only me</option></select><p>Unaudited client: private visibility only, subject to account capabilities.</p><div class="small" style="margin-top:10px"><label><input type="checkbox"> Comments</label> &nbsp; <label><input type="checkbox"> Duet</label> &nbsp; <label><input type="checkbox"> Stitch</label></div><p>Commercial and AI disclosures must be completed in the real app.</p></div>`:''}`:''}<div class="form-footer"><button id="compose-review" class="btn primary" ${composeReady()?'':'disabled'} onclick="showComposeReview()">Review</button></div></section><section class="panel">${panelhead('Preview & review','No media loaded')}<div class="preview-video"><div>${icon('play','lg')}<p>Video preview</p></div></div><div class="form-section"><div class="flex between small"><span class="muted">Account</span><strong>${composeAccount?acc(composeAccount).name:'Not selected'}</strong></div><div class="flex between small" style="margin-top:8px"><span class="muted">Mode</span><strong>${composeMode==='inbox'?'Inbox':'Direct Post'}</strong></div></div><div class="panel-note">This design preview does not submit media or contact TikTok.</div></section></div>`}function composeReady(){if(!composeAccount||composeMode!=='inbox'||composeSource!=='url')return false;try{let u=new URL(composeUrl);return u.protocol==='https:'&&!u.username&&!u.password}catch{return false}}function updateComposeUrl(v){composeUrl=v;$('#compose-review').disabled=!composeReady()}function updateComposeFile(el){const file=el.files?.[0];$('#compose-review').disabled=!composeAccount||composeMode!=='inbox'||!file||file.size<1||file.size>4194304||!['video/mp4','video/quicktime'].includes(file.type)}function showComposeReview(){if(!composeAccount||$('#compose-review')?.disabled){toast('Complete the post details first');return}modal('Review publication',`${namecell(acc(composeAccount))}<div class="flex between small"><span>Mode</span><strong>${composeMode==='inbox'?'Inbox':'Direct Post'}</strong></div><div class="small" style="overflow-wrap:anywhere">${composeSource==='url'?esc(composeUrl):'Selected local file'}</div><p>Actual application must validate the video, capabilities, duration and settings before enabling consent.</p><label class="flex small" style="align-items:flex-start"><input type="checkbox"> <span>I reviewed the exact account and media and authorize this submission.</span></label><div class="note">${icon('lock','sm')} No actual publication can occur in this reference.</div><button class="btn primary" disabled>Submit unavailable in preview</button>`)}function render(){document.getElementById('app').innerHTML=shell();$('#screen').innerHTML=({overview,accounts:accountsView,content:contentView,publishing,agent,compose}[view]||overview)();document.title='CreatorPulse · '+(nav.find(n=>n[0]===view)?.[1]||'New post')+' · Design reference'}const requested=new URL(location.href).searchParams.get('view');if(['overview','accounts','content','publishing','agent','compose'].includes(requested))view=requested;if(view==='compose')composeAccount='a';if(new URL(location.href).searchParams.get('locked')==='1')locked=true;if(new URL(location.href).searchParams.get('state')==='setup'){setup=true;locked=true}render();
</script></body></html>
